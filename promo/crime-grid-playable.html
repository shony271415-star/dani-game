<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 25%, #3a2238 0%, #1d1626 55%, #0c0a11 100%); color: #f3e6c8; font-family: "Quicksand", system-ui, sans-serif; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
  #wrap { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 1.6vh 3vw; gap: 1.2vh; }
  #cap { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-size: min(6vw, 3.3vh); text-align: center; min-height: 2.6em; display: flex; align-items: center; line-height: 1.15; }
  #cap b { color: #ff7b8b; }
  #board { --n: 4; width: min(88vw, 44vh); height: min(88vw, 44vh); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    border: 6px solid #0b090f; border-radius: 10px; background: #fff; box-shadow: 0 0 0 2px rgba(217,164,65,.5), 0 12px 26px rgba(0,0,0,.6); position: relative; flex: 0 0 auto; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(74,59,99,.12); cursor: pointer; }
  .cell.wn { border-top: 4px solid #2e2442; } .cell.ws { border-bottom: 4px solid #2e2442; } .cell.we { border-right: 4px solid #2e2442; } .cell.ww { border-left: 4px solid #2e2442; }
  .obj { width: 72%; height: 72%; display: flex; pointer-events: none; } .obj svg { width: 100%; height: 100%; }
  .cell.rug { background-image: repeating-linear-gradient(45deg, rgba(232,97,90,.25) 0 7px, rgba(255,255,255,.25) 7px 14px) !important; }
  .edge { position: absolute; background: #7fc4f0; border: 3px solid #2e2442; border-radius: 4px; z-index: 2; }
  .edge.n { top: -9px; left: 22%; right: 22%; height: 11px; } .edge.w { left: -9px; top: 22%; bottom: 22%; width: 11px; }
  .zl { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); background: #efe4cf; border: 1.5px solid #1c1822; border-radius: 3px; padding: 0 5px;
    font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(2.6vw, 1.3vh); color: #1c1822; text-transform: uppercase; white-space: nowrap; z-index: 4; pointer-events: none; }
  .tok { position: absolute; inset: 6%; border-radius: 50%; background: #fff; border: 4px solid; overflow: hidden; z-index: 5; animation: pop .35s cubic-bezier(.3,1.6,.6,1); pointer-events: none; }
  .tok svg { width: 100%; height: 100%; }
  .xm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c0392b; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: min(15vw, 7.5vh); opacity: .7; z-index: 3; animation: pop .25s ease-out both; pointer-events: none; }
  .cell.glow::after { content: ""; position: absolute; inset: 0; background: rgba(255,92,92,.35); animation: pulse 0.8s infinite alternate; z-index: 4; }
  .cell.hint { box-shadow: inset 0 0 0 4px #ffb703; animation: pulse .7s infinite alternate; }
  #cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 2.4vw; }
  .card { background: linear-gradient(#efe4cf, #e4d4b2); color: #1c1822; border-radius: 6px; padding: .9vh 2vw; display: flex; gap: 2vw; align-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.25); cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .card.sel { border-color: #ffb703; transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(255,183,3,.35), 0 6px 0 rgba(0,0,0,.25); }
  .card.done { opacity: .45; }
  .card.victim { background: linear-gradient(#ead5cf, #dcc0b8); cursor: default; }
  .face { flex: 0 0 auto; width: min(11vw, 5.6vh); height: min(11vw, 5.6vh); background: #fff; padding: 2px; border-radius: 3px; transform: rotate(-3deg); }
  .face svg { width: 100%; height: 100%; }
  .nm { font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(4.2vw, 2.1vh); text-transform: uppercase; }
  .cl { font-family: "Courier Prime", monospace; font-weight: 700; font-size: min(3.3vw, 1.65vh); line-height: 1.2; } .cl b { color: #b5243a; }
  #status { font-size: min(3.8vw, 1.9vh); color: #c9b48a; text-align: center; min-height: 1.3em; }
  #status.bad { color: #ff7b8b; animation: shake .4s; }
  #cta-mini { margin-top: auto; background: #d9a441; color: #1c1822; border: 0; border-radius: 30px; padding: 1.1vh 7vw; font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(4.6vw, 2.3vh); letter-spacing: 1px; box-shadow: 0 4px 0 #7a5a1f; cursor: pointer; }
  .ov { position: fixed; inset: 0; background: rgba(10,8,14,.9); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 50; padding: 6vw; }
  .ov.show { display: flex; animation: fade .3s; }
  .big { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-size: min(11vw, 5.6vh); line-height: 1.05; }
  .sub { font-family: "Special Elite", "Courier New", monospace; font-size: min(4.8vw, 2.4vh); color: #c9b48a; margin-top: 1.6vh; }
  .logo svg { width: min(34vw, 17vh); height: min(34vw, 17vh); }
  .faces { display: flex; gap: 4vw; margin-top: 3vh; }
  .faces button { background: none; border: 0; color: #f3e6c8; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: min(4.6vw, 2.3vh); cursor: pointer; padding: 0; }
  .faces button div { width: min(22vw, 11vh); height: min(22vw, 11vh); border-radius: 18px; background: #fffdf8; overflow: hidden; margin-bottom: 6px; border: 4px solid transparent; }
  .faces button div svg { width: 100%; height: 100%; }
  .faces button.no div { border-color: #e63946; opacity: .5; }
  .stamp { font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(13vw, 6.5vh); letter-spacing: 3px; border: 6px solid; border-radius: 12px; padding: 0 5vw; transform: rotate(-7deg); animation: slam .35s cubic-bezier(.3,1.6,.6,1); }
  .cta { margin-top: 4vh; background: linear-gradient(#ffcf6b, #d9a441); color: #1c1822; border: 0; border-radius: 40px; padding: 2vh 12vw; font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(7vw, 3.5vh); letter-spacing: 2px; box-shadow: 0 6px 0 #7a5a1f, 0 0 30px rgba(255,207,107,.5); cursor: pointer; animation: breathe 1.1s infinite; }
  .stars { font-size: min(13vw, 6.5vh); color: #ffd166; letter-spacing: 6px; }
  #hand { position: fixed; width: 54px; height: 54px; border-radius: 50%; z-index: 60; pointer-events: none; display: none; margin: -27px 0 0 -27px;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 24%, rgba(255,255,255,.35) 25% 48%, transparent 49%); animation: tapme 1s infinite; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slam { from { transform: rotate(-7deg) scale(2.4); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  @keyframes tapme { 0%,100% { transform: scale(1); } 50% { transform: scale(.78); } }
</style>

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- objects ---------- */

  function makeHelpers(R) {
    return {
      ri: (n) => Math.floor(R() * n),
      pick: (arr) => arr[Math.floor(R() * arr.length)],
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
      },
    };
  }

  function neighbors(N, i) {
    const r = Math.floor(i / N), c = i % N, out = [];
    if (r > 0) out.push(i - N);
    if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1);
    if (c < N - 1) out.push(i + 1);
    return out;
  }

  function makeZones(N, k, R, H) {
    const minSize = N >= 8 ? 5 : 3;
    for (let tries = 0; tries < 500; tries++) {
      const id = new Array(N * N).fill(-1);
      const seeds = H.shuffle([...Array(N * N).keys()]).slice(0, k);
      const size = new Array(k).fill(1);
      seeds.forEach((s, r) => { id[s] = r; });
      let left = N * N - k, stuck = false;
      while (left > 0) {
        const order = H.shuffle([...Array(k).keys()]).sort((a, b) => size[a] - size[b]);
        let grown = false;
        for (const r of order) {
          let best = -1, bestScore = -1;
          for (let i = 0; i < N * N; i++) {
            if (id[i] !== -1) continue;
            const same = neighbors(N, i).filter((j) => id[j] === r).length;
            if (!same) continue;
            const score = same + R() * 1.5;
            if (score > bestScore) { bestScore = score; best = i; }
          }
          if (best >= 0) { id[best] = r; size[r]++; left--; grown = true; break; }
        }
        if (!grown) { stuck = true; break; }
      }
      if (stuck) continue;
      if (Math.min(...size) < minSize) continue;
      if (Math.max(...size) > Math.ceil((N * N) / k) + N) continue;
      return id;
    }
    return null;
  }

  function computeWalls(N, zoneOf) {
    return zoneOf.map((z, i) => {
      const r = Math.floor(i / N), c = i % N;
      return {
        n: r === 0 || zoneOf[i - N] !== z,
        s: r === N - 1 || zoneOf[i + N] !== z,
        w: c === 0 || zoneOf[i - 1] !== z,
        e: c === N - 1 || zoneOf[i + 1] !== z,
      };
    });
  }

  function placeObjects(N, zoneOf, zoneDefs, R, H) {
    const obj = new Array(N * N).fill(null);
    zoneDefs.forEach((def, z) => {
      const cells = H.shuffle(zoneOf.map((x, i) => (x === z ? i : -1)).filter((i) => i >= 0));
      const sz = cells.length;
      const target = Math.max(def[1].length, Math.round(sz * (0.3 + R() * 0.15)));
      const maxBlocked = Math.max(1, Math.floor(sz * 0.3));
      let used = 0, blocked = 0;
      const list = def[1].slice();
      while (list.length < target) list.push(H.pick(def[2]));
      for (const t of list) {
        if (used >= sz - 1) break;
        if (isBlocked(t) && blocked >= maxBlocked) continue;
        const free = cells.filter((i) => obj[i] === null);
        if (!free.length) break;
        if (OBJECTS[t].two) {
          let done = false;
          for (const i of free) {
            const mates = neighbors(N, i).filter((j) => zoneOf[j] === z && obj[j] === null);
            if (mates.length && used + 2 <= sz - 1) { obj[i] = obj[H.pick(mates)] = t; used += 2; done = true; break; }
          }
          if (!done) { obj[free[0]] = t; used++; }
        } else {
          obj[free[0]] = t; used++;
          if (isBlocked(t)) blocked++;
        }
      }
    });
    return obj;
  }

  /* ---------- facts & clues ---------- */
  function cellFacts(P, i) {
    const { N, zoneOf, obj, walls, edges } = P;
    const w = walls[i];
    const f = {
      zone: zoneOf[i], obj: obj[i],
      corner: (w.n || w.s) && (w.e || w.w),
      center: !w.n && !w.s && !w.e && !w.w,
      edge: ['n', 's', 'e', 'w'].some((s) => edges.has(i + s)),
      beside: {},
    };
    for (const j of neighbors(N, i)) {
      if (zoneOf[j] === zoneOf[i] && obj[j] && obj[j] !== obj[i]) f.beside[obj[j]] = true;
    }
    return f;
  }

  function evalUnary(P, c, i) {
    const f = P.facts[i];
    switch (c.t) {
      case 'zone': return f.zone === c.a;
      case 'notZone': return f.zone !== c.a;
      case 'on': return f.obj === c.a;
      case 'floor': return f.obj === null;
      case 'beside': return !!f.beside[c.a];
      case 'notBeside': return !f.beside[c.a];
      case 'edge': return f.edge;
      case 'corner': return f.corner;
      case 'center': return f.center;
      case 'wall': return !f.center;
      default: return true;
    }
  }

  function relHolds(P, r, i, j) {
    const N = P.N;
    const ri = Math.floor(i / N), ci = i % N, rj = Math.floor(j / N), cj = j % N;
    switch (r) {
      case 'same': return P.zoneOf[i] === P.zoneOf[j];
      case 'above': return ri < rj;
      case 'below': return ri > rj;
      case 'left': return ci < cj;
      case 'right': return ci > cj;
      case 'diag': return Math.abs(ri - rj) === 1 && Math.abs(ci - cj) === 1;
      default: return true;
    }
  }

  const NATURAL = { zone: 1, on: 1, floor: 1, beside: 1, edge: 1, corner: 1, center: 1 };

  function trueClues(P, sol, p, victim, extras) {
    const i = sol[p], f = P.facts[i], N = P.N, out = [];
    out.push({ t: 'zone', a: f.zone });
    if (f.obj && !isBlocked(f.obj)) out.push({ t: 'on', a: f.obj });
    if (!f.obj) out.push({ t: 'floor' });
    for (const k of Object.keys(f.beside)) out.push({ t: 'beside', a: k });
    if (f.edge) out.push({ t: 'edge' });
    if (f.corner) out.push({ t: 'corner' });
    if (f.center) out.push({ t: 'center' });
    for (let z = 0; z < P.zones.length; z++) if (z !== f.zone) out.push({ t: 'notZone', a: z });
    for (let q = 0; q < sol.length; q++) {
      if (q === p || q === victim) continue;
      if (P.zoneOf[sol[q]] === f.zone) out.push({ t: 'rel', r: 'same', a: q });
      if (!extras) continue;
      const j = sol[q];
      out.push({ t: 'rel', r: Math.floor(i / N) < Math.floor(j / N) ? 'above' : 'below', a: q });
      out.push({ t: 'rel', r: i % N < j % N ? 'left' : 'right', a: q });
      if (relHolds(P, 'diag', i, j)) out.push({ t: 'rel', r: 'diag', a: q });
    }
    if (extras) {
      if (!f.center) out.push({ t: 'wall' });
      const present = new Set(P.obj.filter(Boolean));
      for (const o of present) if (!f.beside[o] && o !== f.obj) out.push({ t: 'notBeside', a: o });
    }
    return out;
  }

  const clueKey = (c) => c.t + ':' + (c.r || '') + ':' + (c.a === undefined ? '' : c.a);

  /* ---------- exact solver (counts solutions) ---------- */
  function solve(P, clues, limit, budget) {
    const N = P.N, victim = N - 1, NN = N * N;
    let nodes = 0, aborted = false;
    const rowOf = new Int8Array(NN), colOf = new Int8Array(NN);
    for (let i = 0; i < NN; i++) { rowOf[i] = Math.floor(i / N); colOf[i] = i % N; }
    const zoneOf = P.zoneOf;
    const free = [];
    for (let i = 0; i < NN; i++) if (!isBlocked(P.obj[i])) free.push(i);
    const cands = [];
    const relsOf = [...Array(victim)].map(() => []); // [other, r, iAmFirst]
    for (let p = 0; p < victim; p++) {
      cands[p] = free.filter((i) => clues[p].every((c) => c.t === 'rel' || evalUnary(P, c, i)));
      for (const c of clues[p]) if (c.t === 'rel') { relsOf[p].push([c.a, c.r, true]); relsOf[c.a].push([p, c.r, false]); }
    }
    const holds = (r, i, j) => {
      switch (r) {
        case 'same': return zoneOf[i] === zoneOf[j];
        case 'above': return rowOf[i] < rowOf[j];
        case 'below': return rowOf[i] > rowOf[j];
        case 'left': return colOf[i] < colOf[j];
        case 'right': return colOf[i] > colOf[j];
        case 'diag': return Math.abs(rowOf[i] - rowOf[j]) === 1 && Math.abs(colOf[i] - colOf[j]) === 1;
      }
      return true;
    };
    const pos = new Int16Array(N).fill(-1);
    const rowUsed = new Uint8Array(N), colUsed = new Uint8Array(N);
    const sols = [];
    const lists = [...Array(victim)].map(() => new Int16Array(NN));
    const lens = new Int16Array(victim);

    function rec(placed) {
      if (sols.length >= limit || aborted) return;
      if (budget && ++nodes > budget) { aborted = true; return; }
      if (placed === victim) {
        const vi = rowUsed.indexOf(0) * N + colUsed.indexOf(0);
        if (isBlocked(P.obj[vi])) return;
        const out = Array.from(pos); out[victim] = vi; sols.push(out);
        return;
      }
      let best = -1, bestLen = 1e9, rowCover = 0, colCover = 0;
      for (let p = 0; p < victim; p++) {
        if (pos[p] >= 0) continue;
        const L = lists[p]; let n = 0;
        const rl = relsOf[p];
        for (const i of cands[p]) {
          if (rowUsed[rowOf[i]] || colUsed[colOf[i]]) continue;
          let good = true;
          for (let k = 0; k < rl.length; k++) {
            const q = pos[rl[k][0]];
            if (q >= 0 && !(rl[k][2] ? holds(rl[k][1], i, q) : holds(rl[k][1], q, i))) { good = false; break; }
          }
          if (!good) continue;
          L[n++] = i; rowCover |= 1 << rowOf[i]; colCover |= 1 << colOf[i];
        }
        if (!n) return;
        lens[p] = n;
        if (n < bestLen) { bestLen = n; best = p; }
      }
      // every free row/column except the victim's must still be reachable by some suspect
      let missR = 0, missC = 0;
      for (let k = 0; k < N; k++) {
        if (!rowUsed[k] && !(rowCover & (1 << k))) missR++;
        if (!colUsed[k] && !(colCover & (1 << k))) missC++;
      }
      if (missR > 1 || missC > 1) return;
      const choices = Array.from(lists[best].subarray(0, bestLen));
      for (const i of choices) {
        pos[best] = i; rowUsed[rowOf[i]] = colUsed[colOf[i]] = 1;
        rec(placed + 1);
        pos[best] = -1; rowUsed[rowOf[i]] = colUsed[colOf[i]] = 0;
        if (sols.length >= limit || aborted) return;
      }
    }
    rec(0);
    sols.aborted = aborted;
    return sols;
  }

  /* ---------- logic grader: how a person would solve it ----------
     level 1 = pure elimination (singles, hidden singles in rows/cols, relations)
     level 2 = needs "what if" reasoning (assume a spot, find a contradiction) */
  function grade(P, clues, wantCand) {
    const N = P.N, M = N, victim = N - 1, NN = N * N;
    const rels = [];
    let cand = [];
    for (let p = 0; p < M; p++) {
      const s = new Uint8Array(NN);
      for (let i = 0; i < NN; i++) {
        if (isBlocked(P.obj[i])) continue;
        if (p === victim || clues[p].every((c) => c.t === 'rel' || evalUnary(P, c, i))) s[i] = 1;
      }
      cand.push(s);
      if (p !== victim) for (const c of clues[p]) if (c.t === 'rel') rels.push([p, c.r, c.a]);
    }
    const count = (s) => { let n = 0; for (let i = 0; i < NN; i++) n += s[i]; return n; };

    function propagate(cd) {
      let changed = true;
      while (changed) {
        changed = false;
        for (let p = 0; p < M; p++) {
          const n = count(cd[p]);
          if (!n) return false;
          if (n === 1) {
            const i = cd[p].indexOf(1), r = Math.floor(i / N), c = i % N;
            for (let q = 0; q < M; q++) {
              if (q === p) continue;
              for (let k = 0; k < N; k++) {
                if (cd[q][r * N + k]) { cd[q][r * N + k] = 0; changed = true; }
                if (cd[q][k * N + c]) { cd[q][k * N + c] = 0; changed = true; }
              }
            }
          }
        }
        for (let line = 0; line < N; line++) {
          for (const isRow of [true, false]) {
            let who = -1, n = 0;
            for (let p = 0; p < M; p++) {
              for (let k = 0; k < N; k++) {
                const i = isRow ? line * N + k : k * N + line;
                if (cd[p][i]) { if (who !== p) { n++; who = p; } break; }
              }
            }
            if (n === 0) return false;
            if (n === 1) {
              for (let i = 0; i < NN; i++) {
                const inLine = isRow ? Math.floor(i / N) === line : i % N === line;
                if (!inLine && cd[who][i]) { cd[who][i] = 0; changed = true; }
              }
            }
          }
        }
        for (const [a, r, b] of rels) {
          for (let i = 0; i < NN; i++) {
            if (!cd[a][i]) continue;
            let sup = false;
            for (let j = 0; j < NN && !sup; j++) {
              if (cd[b][j] && Math.floor(i / N) !== Math.floor(j / N) && i % N !== j % N && relHolds(P, r, i, j)) sup = true;
            }
            if (!sup) { cd[a][i] = 0; changed = true; }
          }
          for (let j = 0; j < NN; j++) {
            if (!cd[b][j]) continue;
            let sup = false;
            for (let i = 0; i < NN && !sup; i++) {
              if (cd[a][i] && Math.floor(i / N) !== Math.floor(j / N) && i % N !== j % N && relHolds(P, r, i, j)) sup = true;
            }
            if (!sup) { cd[b][j] = 0; changed = true; }
          }
        }
      }
      return true;
    }
    const solved = (cd) => cd.every((s) => count(s) === 1);

    if (!propagate(cand)) return { level: 9 };
    if (wantCand) return { cand };
    if (solved(cand)) return { level: 1, trials: 0 };
    let trials = 0;
    for (let round = 0; round < 60; round++) {
      let progress = false;
      for (let p = 0; p < M && !progress; p++) {
        for (let i = 0; i < NN && !progress; i++) {
          if (!cand[p][i] || count(cand[p]) === 1) continue;
          const copy = cand.map((s) => s.slice());
          copy[p].fill(0); copy[p][i] = 1;
          if (!propagate(copy)) {
            cand[p][i] = 0; trials++; progress = true;
            if (!propagate(cand)) return { level: 9 };
          }
        }
      }
      if (solved(cand)) return { level: 2, trials };
      if (!progress) break;
    }
    return { level: 3, trials };
  }

  /* ---------- clue text ---------- */
  function clueText(P, c, person) {
    const S = person.g === 'm' ? 'He' : 'She';
    const T = P.theme;
    const Q = () => P.people[c.a].name;
    switch (c.t) {
      case 'zone': return `${S} was in the **${P.zones[c.a].name}**.`;
      case 'notZone': return `${S} was **not** in the **${P.zones[c.a].name}**.`;
      case 'on': return `${S} was **${OBJECTS[c.a].occ}**.`;
      case 'floor': return `${S} was standing on the **bare ${T.floor}**.`;
      case 'beside': return `${S} was **beside ${art(OBJECTS[c.a].name)}**.`;
      case 'notBeside': return `${S} was **not beside** any **${OBJECTS[c.a].name}**.`;
      case 'edge': return `${S} was **by ${art(T.edge)}**.`;
      case 'corner': return `${S} was **in a corner**.`;
      case 'center': return `${S} was **${T.center}**.`;
      case 'wall': return `${S} was **${T.wall}**.`;
      case 'rel':
        switch (c.r) {
          case 'same': return `${S} was in the **same ${T.area}** as ${Q()}.`;
          case 'above': return `${S} was in a **higher row** than ${Q()}.`;
          case 'below': return `${S} was in a **lower row** than ${Q()}.`;
          case 'left': return `${S} was in a column **to the left** of ${Q()}.`;
          case 'right': return `${S} was in a column **to the right** of ${Q()}.`;
          case 'diag': return `${S} was **diagonally next to** ${Q()}.`;
        }
    }
    return '';
  }

  /* ---------- generation ---------- */
  function tryGenerate(R, H, diffKey, themeIdx) {
    const D = DIFFICULTY[diffKey], N = D.N, victim = N - 1;
    const theme = THEMES[themeIdx];
    const k = D.zones[0] + H.ri(D.zones[1] - D.zones[0] + 1);
    const zoneOf = makeZones(N, Math.min(k, theme.zones.length), R, H);
    if (!zoneOf) return null;
    const zoneDefs = H.shuffle(theme.zones).slice(0, k);
    const colors = H.shuffle(theme.colors);
    const zones = zoneDefs.map((d, z) => ({ name: d[0], color: colors[z % colors.length] }));
    const obj = placeObjects(N, zoneOf, zoneDefs, R, H);
    const walls = computeWalls(N, zoneOf);

    const edges = new Set(), edgeList = [];
    for (let c = 0; c < N; c++) { edgeList.push(c + 'n'); edgeList.push((N - 1) * N + c + 's'); }
    for (let r = 0; r < N; r++) { edgeList.push(r * N + 'w'); edgeList.push(r * N + N - 1 + 'e'); }
    const ne = D.edges[0] + H.ri(D.edges[1] - D.edges[0] + 1);
    H.shuffle(edgeList).slice(0, ne).forEach((e) => edges.add(e));

    const P = { N, zoneOf, zones, obj, walls, edges, theme };
    P.facts = zoneOf.map((_, i) => cellFacts(P, i));

    // the hidden truth: one person per row and column, nobody on blocked objects,
    // and exactly one suspect alone with the victim
    let sol = null, murderer = -1;
    for (let t = 0; t < 3000 && !sol; t++) {
      const perm = H.shuffle([...Array(N).keys()]);
      const cells = perm.map((c, r) => r * N + c);
      if (cells.some((i) => isBlocked(obj[i]))) continue;
      const order = H.shuffle(cells);
      const vz = zoneOf[order[victim]];
      const with_ = [];
      for (let p = 0; p < victim; p++) if (zoneOf[order[p]] === vz) with_.push(p);
      if (with_.length !== 1) continue;
      sol = order; murderer = with_[0];
    }
    if (!sol) return null;

    const letters = 'ABCDEFGHI'.slice(0, victim).split('').concat('V');
    const faces = { m: H.shuffle(FACES.m), f: H.shuffle(FACES.f) };
    const people = letters.map((L, p) => {
      const [name, g] = H.pick(NAMES[L]);
      return { letter: L, name, g, emoji: faces[g].pop(), color: p === victim ? '#7f1d1d' : TOKEN_COLORS[p % TOKEN_COLORS.length] };
    });
    P.people = people;

    const all = [];
    for (let p = 0; p < victim; p++) all[p] = trueClues(P, sol, p, victim, D.extras);
    const freeCells = [];
    for (let i = 0; i < N * N; i++) if (!isBlocked(obj[i])) freeCells.push(i);
    const size = (c) => {
      if (c.t === 'rel') return c.r === 'diag' ? 3 : c.r === 'same' ? freeCells.length / zones.length : freeCells.length / 2;
      return freeCells.filter((i) => evalUnary(P, c, i)).length;
    };
    const broadPick = (pool) => {
      // prefer clues that leave many possibilities open
      const scored = pool.map((c) => [c, size(c) + R() * freeCells.length * 0.35]).sort((a, b) => b[1] - a[1]);
      return scored[Math.floor(R() * Math.min(3, scored.length))][0];
    };

    const clues = [];
    for (let p = 0; p < victim; p++) {
      let pool = all[p].filter((c) => NATURAL[c.t]);
      if (D.style === 'specific') {
        pool.sort((a, b) => size(a) - size(b));
        clues[p] = [H.pick(pool.slice(0, Math.max(1, Math.ceil(pool.length / 2))))];
      } else if (D.style === 'normal') {
        clues[p] = [H.pick(pool)];
      } else {
        if (D.extras && R() < 0.35) pool = all[p].filter((c) => c.t !== 'notZone' && c.t !== 'notBeside');
        clues[p] = [broadPick(pool)];
      }
    }

    const CAP = 120000; // a search this long means a messy layout: throw the attempt away
    for (let guard = 0; guard < 80; guard++) {
      const sols = solve(P, clues, 2, CAP);
      if (sols.aborted || !sols.length) return null;
      if (sols.length === 1) break;
      const other = sols[0].every((x, i) => x === sol[i]) ? sols[1] : sols[0];
      const diff = H.shuffle([...Array(victim).keys()].filter((p) => other[p] !== sol[p]))
        .sort((a, b) => clues[a].length - clues[b].length);
      let added = false;
      for (const p of diff) {
        if (clues[p].length >= D.maxClues) continue;
        const have = new Set(clues[p].map(clueKey));
        const excl = all[p].filter((c) => {
          if (have.has(clueKey(c))) return false;
          if (c.t === 'rel') return !relHolds(P, c.r, other[p], other[c.a]);
          return !evalUnary(P, c, other[p]);
        });
        if (!excl.length) continue;
        if (D.style === 'broad') clues[p].push(broadPick(excl));
        else {
          const nice = excl.filter((c) => NATURAL[c.t] || (c.t === 'rel' && c.r === 'same'));
          clues[p].push(H.pick(nice.length && R() < 0.8 ? nice : excl));
        }
        added = true;
        break;
      }
      if (!added) return null;
    }
    { const chk = solve(P, clues, 2, CAP); if (chk.aborted || chk.length !== 1) return null; }

    if (D.minimize) {
      const order = H.shuffle([...Array(victim).keys()]);
      for (const p of order) {
        for (let j = clues[p].length - 1; j >= 0 && clues[p].length > 1; j--) {
          const removed = clues[p].splice(j, 1)[0];
          const r = solve(P, clues, 2, D.budget);
          if (r.aborted || r.length !== 1) clues[p].splice(j, 0, removed);
        }
      }
    }

    { const chk = solve(P, clues, 2, CAP); if (chk.aborted || chk.length !== 1) return null; }
    const g = grade(P, clues.concat([[]]));
    people.forEach((person, p) => {
      person.isVictim = p === victim;
      person.rawClues = p === victim ? [] : clues[p];
      person.clues = person.rawClues.map((c) => clueText(P, c, person));
    });
    const story = H.pick(theme.stories);
    return {
      version: VERSION, N, zones, zoneOf, obj, walls,
      edges: [...edges], facts: P.facts, people, solution: sol, murderer, victim,
      theme: { id: theme.id, name: theme.name, icon: theme.icon, area: theme.area, edge: theme.edge, edgeColor: theme.edgeColor, floor: theme.floor, wall: theme.wall, center: theme.center },
      title: story[0], intro: story[1], grade: g,
    };
  }

  function generate(seed, diffKey) {
    const D = DIFFICULTY[diffKey];
    const R = mulberry32(seed * 2654435761 + 12345);
    const H = makeHelpers(R);
    // consecutive cases walk through the scenes so the setting keeps changing
    const themeIdx = (seed * 4 + Math.floor(seed / 100000) * 2) % THEMES.length;
    let best = null;
    const want = D.attempts || 1;
    for (let attempt = 0, got = 0; attempt < 400 && got < want; attempt++) {
      const p = tryGenerate(R, H, diffKey, themeIdx);

  /* ---------- extra clues for the hint button ----------

  function sceneFacts(P, known) {
    const N = P.N, NN = N * N, victim = N - 1;
    const T = P.theme;
    const clues = P.people.map((p) => p.rawClues || []);
    const applyKnown = (cand) => {
      for (const [p, cell] of Object.entries(known.fixed || {})) { cand[p].fill(0); cand[p][cell] = 1; }

    P.zones.forEach((z, zi) => addCount('zone' + zi, (i) => P.zoneOf[i] === zi, `in the **${z.name}**`, { w: 'zone', z: zi }));

    addCount('corner', (i) => P.facts[i].corner, `**in a corner**`, { w: 'corner' });
    addCount('edge', (i) => P.facts[i].edge, `**by ${art(T.edge)}**`, { w: 'edge' });
    addCount('center', (i) => P.facts[i].center, `**${T.center}**`, { w: 'center' });

    }

    const rowOf = (i) => Math.floor(i / N), colOf = (i) => i % N;

      let gone = 0;
      for (let p = 0; p < victim; p++) {
        for (let c = 0; c < NN; c++) {
          if (!cand[p][c]) continue;

          if (f.kind === 'count') {
            let min = f.test(c) ? 1 : 0, max = min;
            for (let q = 0; q < victim && max <= f.k + 1; q++) {
              if (q === p) continue;
              let can = false, must = true, any = false;
              for (let j = 0; j < NN; j++) {
                if (!cand[q][j] || rowOf(j) === rowOf(c) || colOf(j) === colOf(c)) continue;
                any = true;
                if (f.test(j)) can = true; else must = false;
              }

            }

          } else {

              if (P.zoneOf[c] === z) return true;
              for (let q = 0; q < victim; q++) {

                for (let j = 0; j < NN; j++) {
                  if (cand[q][j] && P.zoneOf[j] === z && rowOf(j) !== rowOf(c) && colOf(j) !== colOf(c)) return true;
                }
              }

  // Cyber Agents (premium): glowing visors, circuits and a moving scan line
  function cyberAvatar(p) {

    const hairSvg = f ? `<path d="M19 30c-1-10 5-16 13-16s14 5 14 13c-6-2-12-6-15-9-2 5-7 9-12 12Z" fill="${hair}" ${st(1.3)}/><path d="M44 26c3 5 3 12 1 18" fill="none" stroke="${hair}" stroke-width="4" stroke-linecap="round"/>`

    const face = `<ellipse cx="32" cy="32" rx="12.5" ry="13.5" fill="${skin}" ${st(1.6)}/><path d="M21 38l3-2h3M43 38l-3-2h-3" fill="none" stroke="${c}" stroke-width=".9" opacity=".8"/>`;
    const visor = `<path d="M18 27h28c1 0 1 1 1 2v3c0 2-1 3-3 3H20c-2 0-3-1-3-3v-3c0-1 0-2 1-2Z" fill="#0b0f1e" stroke="${c}" stroke-width="1.6"/>

    const mouth = d ? `<path d="M28.5 40.5c2-1 5-1 7 0" fill="none" ${st(1.5)}/>` : `<path d="M28.5 39.5h7" ${st(1.5)}/>`;

    return SVG64(`${bg}${body}${face}${hairSvg}${visor}${mouth}${scan}`);

  const SKINS = {
    classic: { name: 'Classic Detectives', price: 0, rarity: 'Basic', desc: 'The original cast.', draw: (p) => avatar(p), emoji: null },
    pets: { name: 'Pet Detectives', price: 150, rarity: 'Common', desc: 'Cats, dogs, foxes, owls and more. Paws off the evidence!', draw: petAvatar, emoji: ['🐱', '🐶', '🦊', '🐰', '🐻', '🐼', '🦉', '🐸', '🐯', '🐨'] },
    gangsters: { name: 'Noir Gangsters', price: 300, rarity: 'Rare', desc: 'Fedoras, trench coats and very dark sunglasses.', draw: gangsterAvatar, emoji: ['🕴️', '🤵', '🤵‍♀️', '🧔‍♂️', '👩‍🦰', '🧑‍💼', '👨‍💼', '👩‍💼'] },
    monsters: { name: 'Monster Mash', price: 500, rarity: 'Rare', desc: 'Vampires, mummies, ghosts and one very polite werewolf.', draw: monsterAvatar, emoji: ['🧛', '🧟', '👻', '🧙', '🧌', '🐺', '🎃', '💀', '🧞'] },
    royals: { name: 'Royal Court', price: 800, rarity: 'Epic', desc: 'Crowns, jewels and ermine. Comes with a golden frame.', draw: royalAvatar, emoji: ['🤴', '👸', '🫅', '👑', '🦄', '💎'] },
    space: { name: 'Space Crew', price: 1200, rarity: 'Epic', desc: 'Astronauts and aliens, framed by the stars.', draw: spaceAvatar, emoji: ['👩‍🚀', '🧑‍🚀', '👨‍🚀', '👽', '🤖', '👾', '🛸'] },
    neon: { name: 'Neon Legends', price: 2000, rarity: 'Legendary', desc: 'Glowing neon characters with a pulsing frame. The finest skins in town.', draw: neonAvatar, emoji: ['🌟', '💫', '⚡', '🔮', '🌈', '🪩', '✨'] },
    masquerade: { name: 'Masquerade Ball', price: 0, rarity: 'Premium', desc: 'Venetian masks and feathers.', draw: masqueradeAvatar },
    cyber: { name: 'Cyber Agents', price: 0, rarity: 'Premium', desc: 'Glowing visors and scan lines.', draw: cyberAvatar },
  };

  /* floor finish for each area: wood, tiles, grass, metal, deck... */
  const FLOORS = {
    mansion: ['wood', 'tile', 'wood', 'check', 'wood', 'tile', 'carpet', 'check'],
    ship: ['deck', 'deck', 'wood', 'metal', 'deck', 'wood', 'deck', 'metal'],
    forest: ['grass', 'grass', 'dirt', 'grass', 'stone', 'grass', 'dirt', 'grass'],
    space: ['metal', 'metal', 'tile', 'metal', 'metal', 'tile', 'metal', 'metal'],
    museum: ['marble', 'wood', 'marble', 'tile', 'wood', 'marble', 'check', 'tile'],
    train: ['wood', 'carpet', 'wood', 'metal', 'carpet', 'wood', 'carpet', 'wood'],
    circus: ['dirt', 'wood', 'grass', 'dirt', 'check', 'wood', 'grass', 'dirt'],
    castle: ['stone', 'stone', 'wood', 'stone', 'carpet', 'stone', 'wood', 'stone'],
    ski: ['wood', 'carpet', 'wood', 'snow', 'wood', 'tile', 'snow', 'wood'],
  };

  const API = {
    icon: (o) => (ICONS[o] ? svg(ICONS[o]) : ''),
    has: (o) => !!ICONS[o],
    theme: (id) => svg(THEMES[id] || THEMES.mansion),
    ui: (name) => svg(UI[name] || ''),
    avatar,
    SKINS,
    skinAvatar: (person, id) => (SKINS[id] || SKINS.classic).draw(person),

<script>
'use strict';
/* Crime Grid playable ad: one tiny case, played for real. Works as a plain page, in MRAID ad containers
   (AppLovin, Unity, ironSource, Mintegral…) and in Google Ads HTML5 (ExitApi). Change STORE_URL before upload. */
var STORE_URL = 'https://lamplit-logic.github.io/v2/';
(function () {
  const E = window.MysteryEngine, A = window.MysteryArt;
  const $ = (id) => document.getElementById(id);
  const P = E.finishCustom({
    N: 4,
    theme: { id: 'mansion', name: 'The Mansion', area: 'room', edge: 'window', edgeColor: '#7fc4f0' },
    zones: [{ name: 'Living Room', color: '#cfe0f3' }, { name: 'Kitchen', color: '#fbefc4' }, { name: 'Bedroom', color: '#e6d5ef' }],
    zoneOf: [0, 0, 1, 1, 0, 0, 1, 1, 2, 2, 2, 1, 2, 2, 2, 1],
    obj: ['tv', null, 'table', null, 'plant', 'chair', null, null, null, 'rug', null, null, 'bed', 'bed', null, 'plant'],
    edges: ['3n', '8w'],
    people: [
      { letter: 'A', name: 'Ava', g: 'f', color: '#e74c3c', clues: ['She was **sitting on a chair**.'] },
      { letter: 'B', name: 'Ben', g: 'm', color: '#2980b9', clues: ['He was **lying on a bed**.'] },
      { letter: 'C', name: 'Chloe', g: 'f', color: '#27ae60', clues: ['She was in the **Kitchen**, **by a window**.'] },
      { letter: 'V', name: 'Victor', g: 'm', color: '#7f1d1d', isVictim: true, clues: [] },
    ],
    solution: [5, 12, 3, 10], murderer: 1, victim: 3,
  });
  const N = 4, place = [-1, -1, -1, -1];
  let sel = -1, wrong = 0, finished = false;
  const rich = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const blocked = (i) => E.isBlocked(P.obj[i]);
  const rowCol = (i) => [Math.floor(i / N), i % N];

  // ---- board ----
  const cells = [];
  const labels = { 4: 'Living Room', 7: 'Kitchen', 14: 'Bedroom' };
  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div'), [r, k] = rowCol(i), w = P.walls[i];
    c.className = 'cell';
    if (w.n && r > 0) c.classList.add('wn'); if (w.s && r < N - 1) c.classList.add('ws');
    if (w.w && k > 0) c.classList.add('ww'); if (w.e && k < N - 1) c.classList.add('we');
    c.style.backgroundColor = P.zones[P.zoneOf[i]].color;
    if (P.obj[i] === 'rug') c.classList.add('rug'); else if (P.obj[i]) c.innerHTML = `<div class="obj">${A.icon(P.obj[i])}</div>`;
    if (i === 3) c.insertAdjacentHTML('beforeend', '<div class="edge n"></div>');
    if (i === 8) c.insertAdjacentHTML('beforeend', '<div class="edge w"></div>');
    if (labels[i]) c.insertAdjacentHTML('beforeend', `<div class="zl">${labels[i]}</div>`);
    c.addEventListener('click', () => onCell(i));
    $('board').appendChild(c); cells.push(c);
  }
  // ---- cards ----
  const cards = P.people.map((p, k) => {
    const d = document.createElement('div');
    d.className = 'card' + (p.isVictim ? ' victim' : '');
    d.innerHTML = `<div class="face">${A.avatar(p)}</div><div><div class="nm">${p.name}${p.isVictim ? ' ✝' : ''}</div><div class="cl">${p.isVictim ? 'The victim. Last free square.' : rich(p.clues[0])}</div></div>`;
    if (!p.isVictim) d.addEventListener('click', () => pick(k));
    $('cards').appendChild(d);
    return d;
  });

  // ---- guidance hand ----
  let idle;
  function guide() {
    clearTimeout(idle);
    $('hand').style.display = 'none';
    cells.forEach((c) => c.classList.remove('hint'));
    if (finished) return;
    idle = setTimeout(() => {
      const next = sel >= 0 ? cells[P.solution[sel]] : cards[[0, 1, 2].find((p) => place[p] < 0)];
      if (!next) return;
      const r = next.getBoundingClientRect();
      const h = $('hand'); h.style.left = r.left + r.width / 2 + 'px'; h.style.top = r.top + r.height / 2 + 'px'; h.style.display = 'block';
      if (sel >= 0) next.classList.add('hint');
    }, sel >= 0 || place.some((x) => x >= 0) ? 3500 : 900);
  }
  function say(t, bad) { const s = $('status'); s.innerHTML = t; s.classList.remove('bad'); if (bad) { void s.offsetWidth; s.classList.add('bad'); } }

  function pick(p) {
    if (finished || place[p] >= 0) return;
    sel = p;
    cards.forEach((c, k) => c.classList.toggle('sel', k === p));
    say(`Where was <b>${P.people[p].name}</b>? Tap a square.`);
    guide();
  }
  function drawToken(p) {
    const t = document.createElement('div'); t.className = 'tok';
    t.style.borderColor = P.people[p].isVictim ? '#c0392b' : P.people[p].color; t.innerHTML = A.avatar(P.people[p]);
    cells[place[p]].appendChild(t);
  }
  function sweepX(c) {
    const [r, k] = rowCol(c);
    for (let i = 0; i < N * N; i++) {
      const [ri, ki] = rowCol(i);
      if (i === c || (ri !== r && ki !== k) || place.includes(i) || cells[i].querySelector('.xm')) continue;
      const x = document.createElement('div'); x.className = 'xm'; x.textContent = '✕';
      x.style.animationDelay = (Math.abs(ri - r) + Math.abs(ki - k)) * 0.06 + 's';
      cells[i].appendChild(x);
    }
  }
  function onCell(i) {
    if (finished) return;
    if (sel < 0) { say('First tap a suspect card 👇'.replace(' 👇', ''), true); guide(); return; }
    const [r, k] = rowCol(i);
    if (blocked(i)) { say('Nobody can stand there!', true); return; }
    if (place.some((x) => x >= 0 && (rowCol(x)[0] === r || rowCol(x)[1] === k))) { say('Someone already uses that <b>row or column</b>!', true); return; }
    if (i !== P.solution[sel]) { say('Read the clue again 🔍'.replace(' 🔍', ''), true); cells[i].animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 250); return; }
    place[sel] = i; drawToken(sel); sweepX(i);
    cards[sel].classList.remove('sel'); cards[sel].classList.add('done');
    sel = -1;
    if ([0, 1, 2].every((p) => place[p] >= 0)) {
      say('Victor is in the <b>last free square</b>…');
      setTimeout(() => { place[3] = P.solution[3]; drawToken(3); cards[3].classList.add('done'); cells.forEach((c, j) => { if (P.zoneOf[j] === 2) c.classList.add('glow'); }); }, 600);
      setTimeout(showAccuse, 1700);
      finished = true; guide();
    } else { say('Nice! Next suspect 👇'.replace(' 👇', '')); guide(); }
  }
  function showAccuse() {
    $('faces').innerHTML = P.people.filter((p) => !p.isVictim).map((p, k) => `<button data-p="${k}"><div>${A.avatar(p)}</div>${p.name}</button>`).join('');
    $('faces').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => accuse(+b.dataset.p, b)));
    $('accuse').classList.add('show');
  }
  function accuse(p, b) {
    if (p === P.murderer) { $('accuse').classList.remove('show'); end(true); return; }
    wrong++; b.classList.add('no');
    $('acc-msg').innerHTML = '<span class="stamp" style="color:#e63946;display:inline-block">WRONG!</span><br>Who else was in the <b>Bedroom</b>?';
    if (wrong >= 2) setTimeout(() => { $('accuse').classList.remove('show'); end(false); }, 1400);
  }
  function end(won) {
    finished = true; guide();
    $('logo').innerHTML = A.ui('logo');
    $('end-t').innerHTML = won ? '<span class="stamp" style="color:#2a9d5c;display:inline-block">CASE CLOSED</span><br>You\'re in the 1%!' : 'So close…<br>Ready for a rematch?';
    $('stars').style.display = won ? '' : 'none';
    $('end').classList.add('show');
  }
  // ---- store click-through (MRAID → Google ExitApi → plain link) ----
  function install() {
    try { if (window.mraid && mraid.open) return mraid.open(STORE_URL); } catch (e) { /* fall through */ }
    try { if (window.ExitApi && ExitApi.exit) return ExitApi.exit(); } catch (e) { /* fall through */ }
    window.open(STORE_URL, '_blank');
  }
  $('cta').addEventListener('click', install);
  $('cta-mini').addEventListener('click', install);
  // networks expect the end card within ~30 s even if the player stops
  setTimeout(() => { if (!$('end').classList.contains('show')) { $('accuse').classList.remove('show'); end(false); } }, 45000);
  const start = () => guide();
  if (window.mraid && mraid.getState && mraid.getState() === 'loading') mraid.addEventListener('ready', start); else start();
})();
</script>
