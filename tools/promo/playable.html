<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="ad.size" content="width=320,height=480">
<title>Crime Grid: find the killer</title>
<!--FONTS-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 25%, #3a2238 0%, #1d1626 55%, #0c0a11 100%); color: #f3e6c8; font-family: "Quicksand", system-ui, sans-serif; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
  #wrap { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 1.6vh 3vw; gap: 1.2vh; }
  #cap { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-size: min(6vw, 3.3vh); text-align: center; min-height: 2.6em; display: flex; align-items: center; line-height: 1.15; }
  #cap b { color: #ff7b8b; }
  #board { --n: 4; width: min(88vw, 44vh); height: min(88vw, 44vh); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    border: 6px solid #0b090f; border-radius: 10px; background: #fff; box-shadow: 0 0 0 2px rgba(217,164,65,.5), 0 12px 26px rgba(0,0,0,.6); position: relative; flex: 0 0 auto; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(74,59,99,.12); cursor: pointer; }
  .cell.wn { border-top: 4px solid #2e2442; } .cell.ws { border-bottom: 4px solid #2e2442; } .cell.we { border-right: 4px solid #2e2442; } .cell.ww { border-left: 4px solid #2e2442; }
  .obj { width: 72%; height: 72%; display: flex; pointer-events: none; } .obj svg { width: 100%; height: 100%; }
  .cell.rug { background-image: repeating-linear-gradient(45deg, rgba(232,97,90,.25) 0 7px, rgba(255,255,255,.25) 7px 14px) !important; }
  .edge { position: absolute; background: #7fc4f0; border: 3px solid #2e2442; border-radius: 4px; z-index: 2; }
  .edge.n { top: -9px; left: 22%; right: 22%; height: 11px; } .edge.w { left: -9px; top: 22%; bottom: 22%; width: 11px; }
  .zl { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); background: #efe4cf; border: 1.5px solid #1c1822; border-radius: 3px; padding: 0 5px;
    font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(2.6vw, 1.3vh); color: #1c1822; text-transform: uppercase; white-space: nowrap; z-index: 4; pointer-events: none; }
  .tok { position: absolute; inset: 6%; border-radius: 50%; background: #fff; border: 4px solid; overflow: hidden; z-index: 5; animation: pop .35s cubic-bezier(.3,1.6,.6,1); pointer-events: none; }
  .tok svg { width: 100%; height: 100%; }
  .xm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c0392b; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: min(15vw, 7.5vh); opacity: .7; z-index: 3; animation: pop .25s ease-out both; pointer-events: none; }
  .cell.glow::after { content: ""; position: absolute; inset: 0; background: rgba(255,92,92,.35); animation: pulse 0.8s infinite alternate; z-index: 4; }
  .cell.hint { box-shadow: inset 0 0 0 4px #ffb703; animation: pulse .7s infinite alternate; }
  #cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 2.4vw; }
  .card { background: linear-gradient(#efe4cf, #e4d4b2); color: #1c1822; border-radius: 6px; padding: .9vh 2vw; display: flex; gap: 2vw; align-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.25); cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .card.sel { border-color: #ffb703; transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(255,183,3,.35), 0 6px 0 rgba(0,0,0,.25); }
  .card.done { opacity: .45; }
  .card.victim { background: linear-gradient(#ead5cf, #dcc0b8); cursor: default; }
  .face { flex: 0 0 auto; width: min(11vw, 5.6vh); height: min(11vw, 5.6vh); background: #fff; padding: 2px; border-radius: 3px; transform: rotate(-3deg); }
  .face svg { width: 100%; height: 100%; }
  .nm { font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(4.2vw, 2.1vh); text-transform: uppercase; }
  .cl { font-family: "Courier Prime", monospace; font-weight: 700; font-size: min(3.3vw, 1.65vh); line-height: 1.2; } .cl b { color: #b5243a; }
  #status { font-size: min(3.8vw, 1.9vh); color: #c9b48a; text-align: center; min-height: 1.3em; }
  #status.bad { color: #ff7b8b; animation: shake .4s; }
  #cta-mini { margin-top: auto; background: #d9a441; color: #1c1822; border: 0; border-radius: 30px; padding: 1.1vh 7vw; font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(4.6vw, 2.3vh); letter-spacing: 1px; box-shadow: 0 4px 0 #7a5a1f; cursor: pointer; }
  .ov { position: fixed; inset: 0; background: rgba(10,8,14,.9); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 50; padding: 6vw; }
  .ov.show { display: flex; animation: fade .3s; }
  .big { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-size: min(11vw, 5.6vh); line-height: 1.05; }
  .sub { font-family: "Special Elite", "Courier New", monospace; font-size: min(4.8vw, 2.4vh); color: #c9b48a; margin-top: 1.6vh; }
  .logo svg { width: min(34vw, 17vh); height: min(34vw, 17vh); }
  .faces { display: flex; gap: 4vw; margin-top: 3vh; }
  .faces button { background: none; border: 0; color: #f3e6c8; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: min(4.6vw, 2.3vh); cursor: pointer; padding: 0; }
  .faces button div { width: min(22vw, 11vh); height: min(22vw, 11vh); border-radius: 18px; background: #fffdf8; overflow: hidden; margin-bottom: 6px; border: 4px solid transparent; }
  .faces button div svg { width: 100%; height: 100%; }
  .faces button.no div { border-color: #e63946; opacity: .5; }
  .stamp { font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(13vw, 6.5vh); letter-spacing: 3px; border: 6px solid; border-radius: 12px; padding: 0 5vw; transform: rotate(-7deg); animation: slam .35s cubic-bezier(.3,1.6,.6,1); }
  .cta { margin-top: 4vh; background: linear-gradient(#ffcf6b, #d9a441); color: #1c1822; border: 0; border-radius: 40px; padding: 2vh 12vw; font-family: "Oswald", Impact, sans-serif; font-weight: 600; font-size: min(7vw, 3.5vh); letter-spacing: 2px; box-shadow: 0 6px 0 #7a5a1f, 0 0 30px rgba(255,207,107,.5); cursor: pointer; animation: breathe 1.1s infinite; }
  .stars { font-size: min(13vw, 6.5vh); color: #ffd166; letter-spacing: 6px; }
  #hand { position: fixed; width: 54px; height: 54px; border-radius: 50%; z-index: 60; pointer-events: none; display: none; margin: -27px 0 0 -27px;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 24%, rgba(255,255,255,.35) 25% 48%, transparent 49%); animation: tapme 1s infinite; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slam { from { transform: rotate(-7deg) scale(2.4); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  @keyframes tapme { 0%,100% { transform: scale(1); } 50% { transform: scale(.78); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="cap">Only <b>&nbsp;1%&nbsp;</b> can find the killer</div>
  <div id="board"></div>
  <div id="status">Tap a suspect, then a square.</div>
  <div id="cards"></div>
  <button id="cta-mini">PLAY FULL GAME FREE</button>
</div>
<div class="ov" id="accuse"><div class="big">Who did it?</div><div class="sub">The killer was <b>alone</b> with Victor in one room.</div><div class="faces" id="faces"></div><div class="sub" id="acc-msg"></div></div>
<div class="ov" id="end"><div class="logo" id="logo"></div><div class="big" id="end-t" style="margin-top:3vh">Case closed!</div><div class="stars" id="stars">★★★</div>
  <div class="sub">Rookie 4×4 → Extreme 10×10<br>A new murder every day</div><button class="cta" id="cta">PLAY FREE</button></div>
<div id="hand"></div>
<!--SCRIPTS-->
<script>
'use strict';
/* Crime Grid playable ad: one tiny case, played for real. Works as a plain page, in MRAID ad containers
   (AppLovin, Unity, ironSource, Mintegral…) and in Google Ads HTML5 (ExitApi). Change STORE_URL before upload. */
var STORE_URL = 'https://lamplit-logic.github.io/v2/';
(function () {
  const E = window.MysteryEngine, A = window.MysteryArt;
  const $ = (id) => document.getElementById(id);
  const P = E.finishCustom({
    N: 4,
    theme: { id: 'mansion', name: 'The Mansion', area: 'room', edge: 'window', edgeColor: '#7fc4f0' },
    zones: [{ name: 'Living Room', color: '#cfe0f3' }, { name: 'Kitchen', color: '#fbefc4' }, { name: 'Bedroom', color: '#e6d5ef' }],
    zoneOf: [0, 0, 1, 1, 0, 0, 1, 1, 2, 2, 2, 1, 2, 2, 2, 1],
    obj: ['tv', null, 'table', null, 'plant', 'chair', null, null, null, 'rug', null, null, 'bed', 'bed', null, 'plant'],
    edges: ['3n', '8w'],
    people: [
      { letter: 'A', name: 'Ava', g: 'f', color: '#e74c3c', clues: ['She was **sitting on a chair**.'] },
      { letter: 'B', name: 'Ben', g: 'm', color: '#2980b9', clues: ['He was **lying on a bed**.'] },
      { letter: 'C', name: 'Chloe', g: 'f', color: '#27ae60', clues: ['She was in the **Kitchen**, **by a window**.'] },
      { letter: 'V', name: 'Victor', g: 'm', color: '#7f1d1d', isVictim: true, clues: [] },
    ],
    solution: [5, 12, 3, 10], murderer: 1, victim: 3,
  });
  const N = 4, place = [-1, -1, -1, -1];
  let sel = -1, wrong = 0, finished = false;
  const rich = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const blocked = (i) => E.isBlocked(P.obj[i]);
  const rowCol = (i) => [Math.floor(i / N), i % N];

  // ---- board ----
  const cells = [];
  const labels = { 4: 'Living Room', 7: 'Kitchen', 14: 'Bedroom' };
  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div'), [r, k] = rowCol(i), w = P.walls[i];
    c.className = 'cell';
    if (w.n && r > 0) c.classList.add('wn'); if (w.s && r < N - 1) c.classList.add('ws');
    if (w.w && k > 0) c.classList.add('ww'); if (w.e && k < N - 1) c.classList.add('we');
    c.style.backgroundColor = P.zones[P.zoneOf[i]].color;
    if (P.obj[i] === 'rug') c.classList.add('rug'); else if (P.obj[i]) c.innerHTML = `<div class="obj">${A.icon(P.obj[i])}</div>`;
    if (i === 3) c.insertAdjacentHTML('beforeend', '<div class="edge n"></div>');
    if (i === 8) c.insertAdjacentHTML('beforeend', '<div class="edge w"></div>');
    if (labels[i]) c.insertAdjacentHTML('beforeend', `<div class="zl">${labels[i]}</div>`);
    c.addEventListener('click', () => onCell(i));
    $('board').appendChild(c); cells.push(c);
  }
  // ---- cards ----
  const cards = P.people.map((p, k) => {
    const d = document.createElement('div');
    d.className = 'card' + (p.isVictim ? ' victim' : '');
    d.innerHTML = `<div class="face">${A.avatar(p)}</div><div><div class="nm">${p.name}${p.isVictim ? ' ✝' : ''}</div><div class="cl">${p.isVictim ? 'The victim. Last free square.' : rich(p.clues[0])}</div></div>`;
    if (!p.isVictim) d.addEventListener('click', () => pick(k));
    $('cards').appendChild(d);
    return d;
  });

  // ---- guidance hand ----
  let idle;
  function guide() {
    clearTimeout(idle);
    $('hand').style.display = 'none';
    cells.forEach((c) => c.classList.remove('hint'));
    if (finished) return;
    idle = setTimeout(() => {
      const next = sel >= 0 ? cells[P.solution[sel]] : cards[[0, 1, 2].find((p) => place[p] < 0)];
      if (!next) return;
      const r = next.getBoundingClientRect();
      const h = $('hand'); h.style.left = r.left + r.width / 2 + 'px'; h.style.top = r.top + r.height / 2 + 'px'; h.style.display = 'block';
      if (sel >= 0) next.classList.add('hint');
    }, sel >= 0 || place.some((x) => x >= 0) ? 3500 : 900);
  }
  function say(t, bad) { const s = $('status'); s.innerHTML = t; s.classList.remove('bad'); if (bad) { void s.offsetWidth; s.classList.add('bad'); } }

  function pick(p) {
    if (finished || place[p] >= 0) return;
    sel = p;
    cards.forEach((c, k) => c.classList.toggle('sel', k === p));
    say(`Where was <b>${P.people[p].name}</b>? Tap a square.`);
    guide();
  }
  function drawToken(p) {
    const t = document.createElement('div'); t.className = 'tok';
    t.style.borderColor = P.people[p].isVictim ? '#c0392b' : P.people[p].color; t.innerHTML = A.avatar(P.people[p]);
    cells[place[p]].appendChild(t);
  }
  function sweepX(c) {
    const [r, k] = rowCol(c);
    for (let i = 0; i < N * N; i++) {
      const [ri, ki] = rowCol(i);
      if (i === c || (ri !== r && ki !== k) || place.includes(i) || cells[i].querySelector('.xm')) continue;
      const x = document.createElement('div'); x.className = 'xm'; x.textContent = '✕';
      x.style.animationDelay = (Math.abs(ri - r) + Math.abs(ki - k)) * 0.06 + 's';
      cells[i].appendChild(x);
    }
  }
  function onCell(i) {
    if (finished) return;
    if (sel < 0) { say('First tap a suspect card 👇'.replace(' 👇', ''), true); guide(); return; }
    const [r, k] = rowCol(i);
    if (blocked(i)) { say('Nobody can stand there!', true); return; }
    if (place.some((x) => x >= 0 && (rowCol(x)[0] === r || rowCol(x)[1] === k))) { say('Someone already uses that <b>row or column</b>!', true); return; }
    if (i !== P.solution[sel]) { say('Read the clue again 🔍'.replace(' 🔍', ''), true); cells[i].animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 250); return; }
    place[sel] = i; drawToken(sel); sweepX(i);
    cards[sel].classList.remove('sel'); cards[sel].classList.add('done');
    sel = -1;
    if ([0, 1, 2].every((p) => place[p] >= 0)) {
      say('Victor is in the <b>last free square</b>…');
      setTimeout(() => { place[3] = P.solution[3]; drawToken(3); cards[3].classList.add('done'); cells.forEach((c, j) => { if (P.zoneOf[j] === 2) c.classList.add('glow'); }); }, 600);
      setTimeout(showAccuse, 1700);
      finished = true; guide();
    } else { say('Nice! Next suspect 👇'.replace(' 👇', '')); guide(); }
  }
  function showAccuse() {
    $('faces').innerHTML = P.people.filter((p) => !p.isVictim).map((p, k) => `<button data-p="${k}"><div>${A.avatar(p)}</div>${p.name}</button>`).join('');
    $('faces').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => accuse(+b.dataset.p, b)));
    $('accuse').classList.add('show');
  }
  function accuse(p, b) {
    if (p === P.murderer) { $('accuse').classList.remove('show'); end(true); return; }
    wrong++; b.classList.add('no');
    $('acc-msg').innerHTML = '<span class="stamp" style="color:#e63946;display:inline-block">WRONG!</span><br>Who else was in the <b>Bedroom</b>?';
    if (wrong >= 2) setTimeout(() => { $('accuse').classList.remove('show'); end(false); }, 1400);
  }
  function end(won) {
    finished = true; guide();
    $('logo').innerHTML = A.ui('logo');
    $('end-t').innerHTML = won ? '<span class="stamp" style="color:#2a9d5c;display:inline-block">CASE CLOSED</span><br>You\'re in the 1%!' : 'So close…<br>Ready for a rematch?';
    $('stars').style.display = won ? '' : 'none';
    $('end').classList.add('show');
  }
  // ---- store click-through (MRAID → Google ExitApi → plain link) ----
  function install() {
    try { if (window.mraid && mraid.open) return mraid.open(STORE_URL); } catch (e) { /* fall through */ }
    try { if (window.ExitApi && ExitApi.exit) return ExitApi.exit(); } catch (e) { /* fall through */ }
    window.open(STORE_URL, '_blank');
  }
  $('cta').addEventListener('click', install);
  $('cta-mini').addEventListener('click', install);
  // networks expect the end card within ~30 s even if the player stops
  setTimeout(() => { if (!$('end').classList.contains('show')) { $('accuse').classList.remove('show'); end(false); } }, 45000);
  const start = () => guide();
  if (window.mraid && mraid.getState && mraid.getState() === 'loading') mraid.addEventListener('ready', start); else start();
})();
</script>
</body>
</html>
