<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crime Grid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Crime Grid</title>
<style>
  :root {
    --ink: #2b2340;
    --paper: #fdf3e6;
    --card: #fffaf2;
    --accent: #c0392b;
    --ok: #2e8b57;
    --muted: #7a6f86;
    --wall: #2b2340;
    --bs: min(94vw, 470px, 44vh);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--paper); color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  /* ---------- home ---------- */
  #home {
    background: radial-gradient(circle at 50% 0%, #4a3d6b, #2b2340 70%);
    color: #fff; text-align: center;
    padding: calc(28px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom));
  }
  #home .logo { font-size: 64px; }
  #home h1 { font-size: 36px; margin: 4px 0 2px; letter-spacing: .5px; }
  #home .tag { opacity: .85; font-size: 17px; margin-bottom: 20px; }
  .greet { background: rgba(255,255,255,.12); border-radius: 16px; padding: 12px 16px; width: min(380px, 100%); margin: 0 auto 16px; font-size: 16px; line-height: 1.5; cursor: pointer; }
  .greet b { font-size: 19px; }
  .greet small { opacity: .7; }
  .diff-btn {
    display: flex; align-items: center; justify-content: space-between; text-align: left;
    width: min(380px, 100%); margin: 10px auto; padding: 13px 18px;
    border: none; border-radius: 16px; font-size: 19px; font-weight: 700;
    color: var(--ink); background: #fdf3e6; box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .diff-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .diff-btn small { font-weight: 400; color: var(--muted); font-size: 13.5px; display: block; }
  .diff-btn .badge { background: var(--ink); color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
  .diff-btn.extreme { background: linear-gradient(135deg, #3a0d0d, #7f1d1d); color: #fff; box-shadow: 0 4px 0 #1a0505, 0 0 18px rgba(231,76,60,.35); }
  .diff-btn.extreme small { color: #f5c6c0; }
  .diff-btn.extreme .badge { background: #fff; color: #7f1d1d; }
  .link-btn { background: none; border: 2px solid rgba(255,255,255,.5); color: #fff; padding: 9px 20px; border-radius: 30px; font-size: 15px; margin: 16px 4px 0; }
  .themes-row { margin-top: 18px; font-size: 26px; letter-spacing: 6px; opacity: .9; }

  /* ---------- game ---------- */
  #game { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--ink); color: #fff;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px; position: sticky; top: 0; z-index: 6;
  }
  .topbar button { background: none; border: none; color: #fff; font-size: 22px; padding: 4px 10px; }
  .topbar .title { text-align: center; line-height: 1.2; min-width: 0; }
  .topbar .title b { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title div { font-size: 12px; opacity: .75; }
  .intro { text-align: center; font-style: italic; color: var(--muted); margin: 8px 16px 2px; font-size: 14.5px; }

  .play-area { position: sticky; z-index: 5; background: var(--paper); padding-bottom: 4px; box-shadow: 0 8px 10px -8px rgba(43,35,64,.25); }
  .board-wrap { display: flex; justify-content: center; padding: 8px 8px 2px; }
  .board {
    display: grid; width: var(--bs); height: var(--bs);
    border: 4px solid var(--wall); border-radius: 4px; background: var(--wall);
    position: relative; box-shadow: 0 6px 18px rgba(43,35,64,.25);
  }
  body.mode-x #board { touch-action: none; }
  .cell {
    position: relative; display: flex; align-items: center; justify-content: center;
    border: 0.5px solid rgba(43,35,64,.14); cursor: pointer; min-width: 0; min-height: 0;
  }
  .cell.wall-n { border-top: 2px solid var(--wall); }
  .cell.wall-s { border-bottom: 2px solid var(--wall); }
  .cell.wall-e { border-right: 2px solid var(--wall); }
  .cell.wall-w { border-left: 2px solid var(--wall); }
  .cell.dim::after { content: ""; position: absolute; inset: 0; background: rgba(43,35,64,.2); pointer-events: none; z-index: 5; }
  .cell.rug { background-image: repeating-linear-gradient(45deg, rgba(150,60,60,.18) 0 5px, rgba(255,255,255,.28) 5px 10px) !important; }
  .cell.rug::before { content: ""; position: absolute; inset: 12%; border: 2px dashed rgba(140,50,50,.45); border-radius: 4px; pointer-events: none; }
  .obj { font-size: calc(var(--bs) / var(--n) * 0.56); line-height: 1; pointer-events: none; }
  .cell.has-token .obj { position: absolute; font-size: calc(var(--bs) / var(--n) * 0.26); top: 1px; left: 2px; opacity: .8; }
  .table-obj { width: 72%; height: 56%; background: linear-gradient(#8b5e3c, #6b4428); border-radius: 5px; box-shadow: 0 2px 0 #4a2e1a; pointer-events: none; }
  .cell.has-token .table-obj { display: none; }
  .edge { position: absolute; border: 1px solid #fff; pointer-events: none; z-index: 2; border-radius: 2px; }
  .edge.n { top: -5px; left: 18%; right: 18%; height: 6px; }
  .edge.s { bottom: -5px; left: 18%; right: 18%; height: 6px; }
  .edge.w { left: -5px; top: 18%; bottom: 18%; width: 6px; }
  .edge.e { right: -5px; top: 18%; bottom: 18%; width: 6px; }
  .zone-label {
    position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
    font-size: max(8px, calc(var(--bs) / var(--n) * 0.19)); font-weight: 600; background: rgba(255,255,255,.88); border: 1px solid var(--wall);
    padding: 0 4px; border-radius: 8px; white-space: nowrap; pointer-events: none; z-index: 4; line-height: 1.35;
  }
  .token {
    width: 80%; height: 80%; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--bs) / var(--n) * 0.46); position: relative; z-index: 6;
    animation: pop .18s ease-out; box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .token.letter { color: #fff; font-weight: 800; font-size: calc(var(--bs) / var(--n) * 0.45); border-width: 2px; border-color: #fff; }
  .token.victim { border-color: var(--accent); }
  .token.victim:not(.letter) { background: #fde4e1; }
  .token.conflict { box-shadow: 0 0 0 3px #ff2d2d; animation: pulse 1s infinite; }
  .token.locked { box-shadow: 0 0 0 3px var(--ok); }
  .drafts { position: absolute; inset: 2px; display: grid; align-items: center; justify-items: center; z-index: 4; pointer-events: none;
    font-weight: 800; font-size: calc(var(--bs) / var(--n) / var(--per) * 0.62); line-height: 1; }
  .drafts span { text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .cell.has-draft .obj, .cell.has-draft .table-obj { opacity: .35; }
  .cell.draft-sel { box-shadow: inset 0 0 0 3px var(--ink); }
  .extra { max-width: 740px; margin: 10px auto 0; padding: 10px 14px; background: #fff7d6; border: 2px dashed #d4b24c; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .extra > b:first-child { display: block; margin-bottom: 2px; }
  .extra.flash { animation: flash 1.2s; }
  @keyframes flash { 0%, 60% { background: #ffe680; } }
  @media (max-width: 760px) { .extra { margin: 10px 10px 0; } }
  .help-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .help-list button { text-align: left; }
  .help-list small { display: block; font-weight: 400; font-size: 13px; opacity: .8; margin-top: 2px; }
  .xmark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c0392b; font-weight: 900; font-size: calc(var(--bs) / var(--n) * 0.8); line-height: 1; opacity: .85; pointer-events: none; z-index: 3; text-shadow: 0 0 2px rgba(255,255,255,.5); }
  .xmark.auto { opacity: .45; }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px #ff2d2d66; } }

  .tools { display: flex; justify-content: center; gap: 4px; margin: 7px 4px 0; }
  .tool { border: 2px solid var(--ink); background: var(--card); border-radius: 11px; padding: 5px 7px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .tool.on { background: var(--ink); color: #fff; }
  .status { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin: 4px 10px 0; }

  .suspects { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 10px; max-width: 760px; margin: 0 auto; }
  .suspect {
    background: var(--card); border: 2px solid #e2d6c4; border-radius: 14px; padding: 8px 9px;
    display: flex; gap: 8px; align-items: flex-start; text-align: left; position: relative; transition: transform .1s;
  }
  .suspect.sel { border-color: var(--ink); transform: scale(1.02); box-shadow: 0 4px 12px rgba(43,35,64,.25); }
  .suspect.placed { opacity: .55; }
  .suspect.placed::after { content: "✓"; position: absolute; top: 4px; right: 8px; color: var(--ok); font-weight: 900; }
  .face { flex: 0 0 auto; position: relative; width: 44px; height: 44px; border-radius: 10px; background: #f3e3c8; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .face .lt { position: absolute; bottom: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .suspect.is-victim { background: #fdeceb; border-color: #f2b8b2; }
  .suspect.is-victim .face { filter: grayscale(.6); }
  .suspect .nm { font-weight: 800; font-size: 15.5px; }
  .suspect .cl { font-size: 13px; line-height: 1.38; }
  .suspect .cl b { color: #8e2f22; }
  .suspect .cl div { margin-top: 2px; }

  .legend { max-width: 760px; margin: 8px auto 0; padding: 0 14px; font-size: 13px; color: var(--muted); }
  .legend summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 14px; }
  .legend ul { margin: 6px 0; padding-left: 18px; line-height: 1.5; }


  /* ---------- journey, coins, gifts, calendar, trophies ---------- */
  .coins-pill { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; background: rgba(255,255,255,.16); border-radius: 20px; padding: 6px 12px; font-size: 16px; display: flex; align-items: center; gap: 5px; }
  #home { position: relative; }
  .play-card { display: flex; align-items: center; gap: 14px; width: min(380px, 100%); margin: 0 auto; padding: 16px 18px; border: none; border-radius: 20px;
    background: linear-gradient(135deg, #7ee0b5, #3fbf8f); color: #12382a; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.3); font-size: 22px; }
  .play-card.boss { background: linear-gradient(135deg, #ff9a8b, #e8615a); color: #3a0f0b; }
  .play-card .pc-ic { font-size: 34px; line-height: 1; }
  .play-card .pc-tx { flex: 1; } .play-card .pc-tx b { display: block; font-size: 24px; }
  .play-card small { font-size: 14px; font-weight: 600; opacity: .85; }
  .lvl-badge { background: rgba(255,255,255,.85); color: #2b2340; border-radius: 14px; min-width: 46px; padding: 6px 8px; text-align: center; font-weight: 800; font-size: 20px; }
  .journey-bar { width: min(340px, 90%); height: 8px; margin: 10px auto 0; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
  .journey-bar div { height: 100%; background: #ffd166; border-radius: 6px; }
  .section-h { margin: 18px auto 2px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .7; }
  .mini-link { background: none; border: none; color: inherit; text-decoration: underline; font-size: inherit; padding: 0; }
  .bonus-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 8px 0; }
  .bday { border: 2px solid #e2d6c4; border-radius: 10px; padding: 4px 2px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bday small { font-size: 10px; opacity: .7; } .bday.got { opacity: .5; } .bday.now { border-color: #f0b429; background: #fff4cc; transform: scale(1.08); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 10px; }
  .cal-h { font-size: 12px; opacity: .6; font-weight: 700; }
  .cal-d { aspect-ratio: 1; border-radius: 10px; background: #f3ecdf; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; position: relative; }
  .cal-d.done { background: #fff1c2; } .cal-d.today { box-shadow: inset 0 0 0 2px var(--ink); } .cal-d.future { opacity: .45; }
  .cal-d .ic svg { width: 16px; height: 16px; } .cal-d.done span { font-size: 10px; }
  .cal-tro { display: flex; align-items: center; gap: 6px; justify-content: center; } .cal-tro .ic svg { width: 30px; height: 30px; }
  .ach-list { text-align: left; display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
  .ach { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 12px; background: #f3ecdf; opacity: .55; font-size: 22px; }
  .ach.got { opacity: 1; background: #fff1c2; } .ach b { display: block; font-size: 15px; } .ach small { font-size: 12.5px; }
  .ach .ic svg { width: 30px; height: 30px; }
  .price { float: right; font-size: 13px; background: rgba(255,255,255,.2); border-radius: 10px; padding: 1px 7px; }
  .secondary .price { background: #f3ecdf; }
  .earned { font-size: 18px; } .lvl-done { font-weight: 800; color: var(--ok); font-size: 18px; }
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: #fffaf2; color: var(--ink);
    border-radius: 16px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; gap: 10px; align-items: center; min-width: 260px; animation: pop .25s ease-out; transition: opacity .35s, transform .35s; }
  .toast.out { opacity: 0; transform: translate(-50%, -20px); }
  .toast.low { top: auto; bottom: calc(14px + env(safe-area-inset-bottom)); } .toast.low.out { transform: translate(-50%, 20px); }
  .toast .ti { font-size: 30px; } .toast .ti svg { width: 38px; height: 38px; } .toast b { display: block; } .toast small { font-size: 12.5px; }
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }




  .shop-card { display: flex; align-items: center; gap: 10px; width: min(380px, 100%); margin: 12px auto 0; padding: 10px 14px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #b9a2ec, #7d62c4); color: #fff; text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,.3); font-size: 17px; }
  .shop-card .sc-faces { display: flex; } .shop-card .pf { width: 34px; height: 34px; font-size: 24px; margin-right: -8px; border: 2px solid #fff; border-radius: 10px; }
  .shop-card .sc-tx { flex: 1; margin-left: 8px; } .shop-card .sc-tx b { display: block; } .shop-card small { font-size: 12.5px; opacity: .9; }
  .shop-card .badge { background: #fff; color: #4a3b63; border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .cp-shop { font-size: 10px; font-weight: 800; letter-spacing: 1px; background: #f6c85f; color: #2b2340; border-radius: 8px; padding: 1px 5px; margin-left: 3px; }


  /* ---------- journey map, friends, duels ---------- */
  #map { background: radial-gradient(circle at 50% 0%, #4a3d6b, #2b2340 60%, #1d1730); color: #fff; padding-bottom: 60px; }
  .map-canvas { position: relative; margin: 0 auto; }
  .map-path { position: absolute; left: 0; top: 0; pointer-events: none; }
  .mp-todo { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 14; }
  .mp-done { fill: none; stroke: #f6c85f; stroke-width: 9; stroke-linecap: round; opacity: .9; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; border: 4px solid rgba(255,255,255,.92); padding: 0;
    font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(0,0,0,.35); z-index: 2; }
  .node.done { background: #f6c85f; color: #2b2340; }
  .node.cur { width: 72px; height: 72px; background: #e8615a; color: #fff; font-size: 24px; animation: nodePulse 1.4s ease-in-out infinite; }
  .node.locked { background: #3a3346; color: #a49bb6; border-color: #5a5168; }
  .node.boss { width: 64px; height: 64px; }
  .node.boss.locked { background: #4a1d2a; border-color: #d6455c; color: #ff9aa8; }
  .node .nb { position: absolute; top: -17px; font-size: 9.5px; letter-spacing: 1px; background: #b5243a; color: #fff; padding: 1px 5px; border-radius: 6px; }
  .nstars { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 14px; white-space: nowrap; letter-spacing: -1px; }
  .nstars i { color: rgba(255,255,255,.35); font-style: normal; } .nstars i.on { color: #ffd166; text-shadow: 0 1px 0 #000; }
  .theme-dec { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; opacity: .8; font-size: 22px; z-index: 1; line-height: 30px; text-align: center; }
  .theme-dec svg { width: 100%; height: 100%; }
  .tier-banner { position: absolute; left: 8%; right: 8%; text-align: center; color: #ffd166; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-size: 12.5px; border-top: 1px dashed rgba(255,209,102,.55); padding-top: 4px; z-index: 1; }
  .me-pin, .friend-pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 3; pointer-events: none; }
  .pin-face { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 3px solid #ffd166; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,.45); }
  .pin-face svg { width: 100%; height: 100%; }
  .me-pin { animation: bob 1.6s ease-in-out infinite; }
  .friend-pin .pin-face { width: 34px; height: 34px; border-color: #7aa7ff; font-size: 22px; }
  .me-pin small, .friend-pin small { background: rgba(0,0,0,.65); color: #fff; font-size: 10.5px; border-radius: 6px; padding: 0 5px; margin-top: 2px; white-space: nowrap; }
  @keyframes bob { 50% { transform: translate(-50%, -60%); } }
  @keyframes nodePulse { 50% { box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 0 10px rgba(232,97,90,.28); } }
  .mf-btn { font-size: 14px !important; border: 1px solid rgba(255,255,255,.5) !important; border-radius: 10px; padding: 4px 10px !important; }
  .friend-list { display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 40vh; overflow: auto; margin: 8px 0; }
  .friend-row { display: flex; align-items: center; gap: 8px; background: #f3ecdf; border-radius: 12px; padding: 6px 8px; }
  .friend-row b { display: block; } .friend-row small { font-size: 12px; } .friend-row > div { flex: 1; } .friend-row .pf { width: 42px; height: 42px; font-size: 28px; }
  .mini-x { background: none; border: none; font-size: 16px; opacity: .6; }
  .share-box { min-height: 90px; font-size: 13px; text-align: left; }
  .duel { margin: 8px 0; padding: 8px; border-radius: 12px; font-weight: 800; } .duel.won { background: #d9f7e3; color: #1f6b3a; } .duel.lost { background: #fde4e1; color: #8e2f22; }
  .duel small { font-weight: 600; }
  .duel-btn { font-size: 14px !important; }

  .ios-note { background: #fff4d6; border-radius: 10px; padding: 8px 10px; font-size: 13px; text-align: left; margin: 6px 0; line-height: 1.4; }
  .ios-note button { margin-top: 6px; font-size: 13px; padding: 6px 10px; }


  .storage-note { width: min(380px, 100%); margin: 10px auto 0; padding: 8px 12px; border-radius: 12px; background: rgba(246,200,95,.16); border: 1px solid rgba(246,200,95,.5); font-size: 12.5px; line-height: 1.4; text-align: left; }
  .storage-note .mini-link { color: #ffd166; font-weight: 700; }
  .restore-h { margin: 14px 0 4px; }

  /* ---------- coin shop and skin frames ---------- */
  .coins-pill { cursor: pointer; }
  .shop-list { display: flex; flex-direction: column; gap: 10px; max-height: 58vh; overflow: auto; text-align: left; padding: 2px; }
  .pack { border-radius: 14px; padding: 10px 12px; background: #fff; border: 2px solid #e2d6c4; display: flex; flex-direction: column; gap: 6px; }
